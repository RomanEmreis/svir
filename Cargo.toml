[package]
name = "svir"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "A small, composable SDK for talking to large language models"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RomanEmreis/svir"
documentation = "https://docs.rs/svir"
authors = ["Roman Emreis <me@romanemreis.com>"]
readme = "README.md"
keywords = ["llm", "openai", "sse", "streaming", "ai"]
categories = ["api-bindings", "asynchronous"]
# The package keeps the conformance suite and the examples; repository plumbing stays out.
exclude = [".github/", ".gitattributes"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["client", "tls"]
# `Client`, `EventStream`, the hyper transport, and attachments read from disk.
client = ["dep:futures-core", "dep:hyper", "dep:hyper-util", "dep:tokio"]
# Tool input schemas derived from the types of handlers' arguments.
schemars = ["dep:schemars"]
# The `Trace` layer.
tracing = ["client", "dep:tracing"]
# HTTPS, through rustls with the ring provider and the webpki roots.
tls = ["client", "dep:hyper-rustls", "dep:rustls", "hyper-rustls/ring", "rustls/ring", "hyper/http2", "hyper-util/http2"]
# HTTPS with the aws-lc-rs provider in place of ring, for a build that has it already. With both
# on, aws-lc-rs is used; turning the default features off keeps ring out of the build.
tls-aws-lc = ["client", "dep:hyper-rustls", "dep:rustls", "hyper-rustls/aws-lc-rs", "rustls/aws_lc_rs", "hyper/http2", "hyper-util/http2"]

[dependencies]
base64 = "0.22"
bytes = "1"
futures-core = { version = "0.3", default-features = false, features = ["std"], optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "webpki-roots"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt", "time"], optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }

# Examples that talk to a server need the client; `codec` needs nothing.
[[example]]
name = "models"
required-features = ["client"]

[[example]]
name = "complete"
required-features = ["client"]

[[example]]
name = "stream"
required-features = ["client"]

[[example]]
name = "chat"
required-features = ["client"]

[[example]]
name = "attachments"
required-features = ["client"]

[[example]]
name = "tools"
required-features = ["client"]

[[example]]
name = "tools_typed"
required-features = ["client", "schemars"]

[[example]]
name = "toolbox"
required-features = ["client"]

[[example]]
name = "layers"
required-features = ["client"]

[[example]]
name = "relay"
required-features = ["client"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
