[package]
name = "svir"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small, composable SDK for talking to large language models"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RomanEmreis/svir"
authors = ["Roman Emreis <me@romanemreis.com>"]
readme = "README.md"
keywords = ["llm", "openai", "sse", "streaming", "ai"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
base64 = "0.22"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
